# GoReleaser configuration.
#
# This project links libopus via cgo. The release workflow builds libopus/
# libopusfile as static libraries and statically links them, building linux
# natively and cross-compiling darwin/amd64 on the Apple Silicon runner
# (clang -arch x86_64).
#
# CI builds the binaries with `go build` directly (goreleaser spawns the
# compiler in a sanitized env that drops PKG_CONFIG_PATH, which broke the static
# opus link). This file is kept for local dry runs
# (`goreleaser release --snapshot --clean`) and documents the intended release
# layout; CI packages the per-runner binaries to match.
version: 2

project_name: kitten-tts-go

before:
  hooks:
    - go mod tidy

builds:
  - id: kitten-tts
    main: ./cmd/kitten-tts
    binary: kitten-tts
    env:
      - CGO_ENABLED=1
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

  - id: kitten-tts-server
    main: ./cmd/kitten-tts-server
    binary: kitten-tts-server
    env:
      - CGO_ENABLED=1
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: default
    ids:
      - kitten-tts
      - kitten-tts-server
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: itamaker
    name: kitten-tts-go
