name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Build natively on each target OS/arch. The project links libopus via cgo, so
  # each runner builds only its own platform with `goreleaser build
  # --single-target` (cross-compiling cgo to macOS in CI is impractical).
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: macos-13, goos: darwin, goarch: amd64 }
          - { runner: macos-latest, goos: darwin, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so GoReleaser can derive the version

      # hraban/opus links libopus + libopusfile (#cgo pkg-config: opus opusfile).
      - name: Install libopus (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev libopusfile-dev pkg-config

      - name: Install libopus (macOS)
        if: runner.os == 'macOS'
        run: brew install opus opusfile pkg-config

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true

      - name: Build (cgo, native target)
        env:
          CGO_ENABLED: "1"
        run: goreleaser build --single-target --clean

      - name: Package archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          pkg="kitten-tts-go_${version}_${{ matrix.goos }}_${{ matrix.goarch }}"
          mkdir -p "staging/${pkg}"
          find dist -type f -name kitten-tts -exec cp {} "staging/${pkg}/" \;
          find dist -type f -name kitten-tts-server -exec cp {} "staging/${pkg}/" \;
          cp README.md LICENSE "staging/${pkg}/"
          tar -C staging -czf "${pkg}.tar.gz" "${pkg}"
          ls -la "${pkg}.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "*.tar.gz"
          if-no-files-found: error

  # Collect every platform's archive, checksum them, and publish one Release.
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum *.tar.gz > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/checksums.txt
          generate_release_notes: true
